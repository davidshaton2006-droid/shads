name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Часть тестов подтягивает @supabase/supabase-js через src/lib/supabase.js (мокается, но require нужен).
      - run: npm ci
      - run: npm test
